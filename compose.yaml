services:
  api:
    build:
      context: ./reidig-sys
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REIDIG_ENV=dev
      - PORT=8000
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped

  apk:
    build:
      context: ./android
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
